<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium PDF Flipbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Page Flip Library -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <!-- JSZip for downloading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">FlipBook<span>Pro</span></div>
            <div class="actions">
                <button id="btn-upload" class="btn secondary">Change PDF</button>
                <button id="btn-download" class="btn primary">Download Ebook</button>
            </div>
        </header>

        <main>
            <!-- Upload Section -->
            <div id="upload-section" class="card">
                <div class="upload-zone" id="drop-zone">
                    <div class="icon">📄</div>
                    <h2>Create your Flipbook</h2>
                    <p>Drag and drop your PDF here, or click to browse.</p>
                    <input type="file" id="file-input" accept="application/pdf" hidden>
                    <button class="btn primary" onclick="document.getElementById('file-input').click()">Select PDF</button>
                </div>
            </div>

            <!-- Loader -->
             <div id="loader" class="loader-container hidden">
                <div class="spinner"></div>
                <p>Rendering pages... <span id="progress">0%</span></p>
             </div>

            <!-- Flipbook Section -->
            <div id="flipbook-section" class="flipbook-container hidden">
                <div class="flipbook-wrapper">
                    <div id="flipbook" class="flipbook">
                        <!-- Pages will be injected here -->
                    </div>
                </div>
                
                <div class="controls">
                    <button id="btn-prev" class="nav-btn">←</button>
                    <div class="page-info">Page <span id="current-page">1</span> of <span id="total-pages">0</span></div>
                    <button id="btn-next" class="nav-btn">→</button>
                </div>
            </div>
        </main>

        <footer>
            <p>Built for permanent storage. No server required.</p>
        </footer>
    </div>

    <!-- Modals or overlays could go here -->
    
    <script src="script.js"></script>
</body>
</html>
